# Dependabot version updates. Options:
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/hack/tool/backup_restore"
      - "/hack/tool/validation/tf_validation_backend"
    schedule:
      interval: "weekly"
    # A release has to be a week old before it is proposed, so a bad or
    # compromised version has time to be pulled first.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "Chore: "
      include: "scope"
    # k8s.io and controller-runtime move together with KubeVela, so they're bumped by hand.
    ignore:
      - dependency-name: k8s.io/*
      - dependency-name: sigs.k8s.io/controller-runtime
    groups:
      # Minor and patch updates arrive as one weekly PR; each major stays on its own.
      go-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "Chore: "
      include: "scope"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "Chore: "
      include: "scope"
    # The Go toolchain is set in go.mod and moved by hand across the KubeVela repos.
    ignore:
      - dependency-name: golang
